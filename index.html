<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phi Phụng Fit</title>
<meta name="description" content="90 ngày chăm sóc bản thân">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phi Phụng Fit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; overscroll-behavior-y: none; }
body { margin: 0; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
input, textarea, .msg, .note, p { -webkit-user-select: text; user-select: text; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: một cột điện thoại (tối đa 480px) kiểu bảng đo hiệu suất — nền đen, vòng chỉ số lớn,
   mỗi chỉ số một màu riêng luôn kèm nhãn chữ; thanh tab cố định dưới cùng + nút ghi nhanh. */
:root {
  --bg: #050607; --surface: #0f1113; --surface-2: #171a1d; --surface-3: #1f2327; --line: #262a2f;
  --fg: #f3f5f6; --muted: #949ca3; --faint: #5f676e;
  --kcal: #ffb27a; --pro: #62e394; --carb: #ffd666; --fat: #c9a8ff; --water: #61c9ff;
  --brand: #ff8fb4; --warn: #ffc35a; --danger: #ff6464; --ok: #62e394;
  --btn-bg: #f3f5f6; --btn-fg: #050607; --scrim: rgba(0, 0, 0, .72);
  --ring-track: #22262a;
  --f-num: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px; --r-ctl: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f5; --surface: #ffffff; --surface-2: #eef0f2; --surface-3: #e3e6e9; --line: #dfe2e6;
    --fg: #0c0e10; --muted: #5a636b; --faint: #8a939a;
    --kcal: #c45c12; --pro: #138a42; --carb: #946e00; --fat: #7a4fd1; --water: #0a7fbe;
    --brand: #d42f6b; --warn: #a15f00; --danger: #c62828; --ok: #138a42;
    --btn-bg: #0c0e10; --btn-fg: #ffffff; --scrim: rgba(10, 12, 14, .45); --ring-track: #e4e7ea;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f5; --surface: #ffffff; --surface-2: #eef0f2; --surface-3: #e3e6e9; --line: #dfe2e6;
  --fg: #0c0e10; --muted: #5a636b; --faint: #8a939a;
  --kcal: #c45c12; --pro: #138a42; --carb: #946e00; --fat: #7a4fd1; --water: #0a7fbe;
  --brand: #d42f6b; --warn: #a15f00; --danger: #c62828; --ok: #138a42;
  --btn-bg: #0c0e10; --btn-fg: #ffffff; --scrim: rgba(10, 12, 14, .45); --ring-track: #e4e7ea;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input[type="number"] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 168px; display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 16px 8px; display: flex; align-items: center; gap: 10px; }
.top .mascot { width: 34px; height: 34px; flex: none; }
.top-text { flex: 1; min-width: 0; }
.top-text .eyebrow { display: block; }
.top-text h1 { font-size: 19px; font-weight: 700; }
.sync { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.on i { background: var(--ok); }
.sync.err i { background: var(--warn); }

.eyebrow { font-family: var(--f-num); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-head h2 { font-family: var(--f-num); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.card.flat { background: transparent; border-style: dashed; }
.section-title { font-family: var(--f-num); font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* Dials */
.dials { display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: end; gap: 6px; padding: 18px 8px 14px; background: radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--surface)); }
.dial { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; background: none; border: 0; padding: 0; }
.dial svg { width: 100%; max-width: 150px; height: auto; display: block; }
.dial .lbl { font-family: var(--f-num); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.dial .sub { font-size: 12px; color: var(--muted); }
.ring-track { stroke: var(--ring-track); }
.ring-val { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
.ring-text { font-family: var(--f-num); font-weight: 700; fill: var(--fg); }
.ring-unit { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.mini-dials { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mini-dials .dial svg { max-width: 76px; }
.c-kcal { color: var(--kcal); } .c-pro { color: var(--pro); } .c-carb { color: var(--carb); } .c-fat { color: var(--fat); } .c-water { color: var(--water); } .c-brand { color: var(--brand); }
.s-kcal { stroke: var(--kcal); } .s-pro { stroke: var(--pro); } .s-carb { stroke: var(--carb); } .s-fat { stroke: var(--fat); } .s-water { stroke: var(--water); } .s-brand { stroke: var(--brand); }

/* Stats */
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font-family: var(--f-num); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Bars */
.bar { height: 8px; border-radius: 99px; background: var(--ring-track); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: currentColor; transition: width .6s ease; }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .5; }
.macro-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.macro-row .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

/* Pills / chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.k { color: var(--kcal); } .chip.p { color: var(--pro); } .chip.c { color: var(--carb); } .chip.f { color: var(--fat); } .chip.w { color: var(--water); }
.chip.warn { color: var(--warn); } .chip.danger { color: var(--danger); } .chip.ok { color: var(--ok); } .chip.brand { color: var(--brand); }
.pcf { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 0 var(--line); }
.subtabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 15; background: var(--bg); padding-block: 4px; }

/* Buttons */
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn.brand { background: var(--brand); border-color: var(--brand); color: #1a0710; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns > .btn { flex: 1 1 auto; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn.boxed { background: var(--surface-2); border: 1px solid var(--line); }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; font-size: 13px; min-height: 32px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 46px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); padding: 10px 12px; font-size: 16px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.form-error { color: var(--danger); font-size: 13px; font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; font-weight: 700; flex: none; }
.stepper input { width: 84px; text-align: center; min-height: 40px; padding: 6px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.box { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; transition: .15s; }
.check input:checked + .box, .box.on { background: var(--ok); border-color: var(--ok); color: #04210f; }
.check input:focus-visible + .box { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); transition: .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); transition: .2s; }
.switch input:checked + i { background: var(--ok); }
.switch input:checked + i::after { transform: translateX(20px); background: #fff; }
.switch input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
.thumb { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 24px; }
.thumb.lg { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.item-sub { font-size: 12px; color: var(--muted); }
.clamp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Recipe / food cards */
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-width: 0; }
.rcard .art { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; display: grid; place-items: center; font-size: 44px; background: radial-gradient(circle at 50% 35%, var(--surface-3), var(--surface-2)); position: relative; }
.rcard .art .fav { position: absolute; top: 6px; right: 8px; font-size: 14px; color: var(--brand); }
.rcard .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.rcard .kc { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--kcal); line-height: 1; }
.rcard .kc small { font-size: 12px; color: var(--muted); font-family: var(--f-body); font-weight: 500; }
.mac3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 11px; }
.mac3 span { display: flex; flex-direction: column; background: var(--surface-2); border-radius: 8px; padding: 4px 6px; }
.mac3 b { font-family: var(--f-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.nut4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nut4 div { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nut4 b { font-family: var(--f-num); font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
.nut4 span { font-size: 11px; color: var(--muted); }

/* Meal plan */
.daystrip { display: flex; gap: 6px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
.daystrip::-webkit-scrollbar { display: none; }
.daybtn { flex: none; width: 52px; min-height: 62px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: center; }
.daybtn .d { font-family: var(--f-num); font-weight: 700; font-size: 20px; line-height: 1; }
.daybtn .w { font-size: 11px; color: var(--muted); }
.daybtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.daybtn[aria-pressed="true"] .w { color: var(--bg); opacity: .7; }
.daybtn.today { border-color: var(--brand); }
.meal { display: flex; gap: 12px; align-items: flex-start; }
.meal-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.done-tag { color: var(--ok); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

/* Grocery */
.g-row { border-bottom: 1px solid var(--line); }
.g-row:last-child { border-bottom: 0; }
.g-main { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-height: 56px; }
.g-check { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: transparent; padding: 0; }
.g-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.g-row.bought .g-name { text-decoration: line-through; color: var(--muted); }
.g-row.have .g-name { color: var(--muted); }
.g-qty { font-family: var(--f-num); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.g-qty small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.g-detail { padding: 0 0 14px 54px; display: flex; flex-direction: column; gap: 10px; }
.g-group { font-family: var(--f-num); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--muted); padding-top: 8px; }
.progress-big { display: flex; align-items: baseline; gap: 6px; }
.progress-big .num { font-size: 40px; }

/* Water bottle */
.bottle-wrap { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.bottle { width: 96px; height: 150px; }
.wave { animation: wave 3.2s linear infinite; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(-80px); } }
.quick4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick4 .btn { padding: 0 4px; font-family: var(--f-num); font-size: 17px; font-weight: 700; }

/* Alerts */
.alert { border-radius: var(--r-card); padding: 14px 16px; display: flex; gap: 12px; border: 1px solid; }
.alert h3 { font-size: 15px; margin-bottom: 2px; }
.alert p { font-size: 14px; }
.alert.warning { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.alert.warning svg { color: var(--warn); }
.alert.emergency { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface)); }
.alert.emergency svg { color: var(--danger); }
.alert.info { border-color: var(--line); background: var(--surface-2); }
.alert.info svg { color: var(--water); }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* Chart */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.ch-band { fill: var(--ok); opacity: .14; }
.ch-goal { stroke: var(--brand); stroke-dasharray: 4 4; stroke-width: 1.5; fill: none; }
.ch-line { stroke: var(--fg); stroke-width: 2; fill: none; }
.ch-avg { stroke: var(--water); stroke-width: 2; fill: none; }
.ch-trend { stroke: var(--carb); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.ch-pt { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
.ch-pt.sel { fill: var(--fg); }
.ch-lbl { fill: var(--fg); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.ch-lbl-ok { fill: var(--ok); font-size: 10px; font-family: var(--f-body); }
.ch-lbl-goal { fill: var(--brand); font-size: 10px; font-family: var(--f-body); }
.ch-hit { fill: transparent; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; background: currentColor; }
.bars7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; }

.badge { border-radius: 14px; padding: 10px 8px; text-align: center; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 12px; }
.badge .ico { font-size: 22px; filter: grayscale(1); opacity: .35; }

/* Nhãn kiêng / dị ứng: suy ra từ thực phẩm; công thức kế thừa từ nguyên liệu (trừ khi có món thay thế). */
const AL_RULES = [
  [/^ga_/, ["meat", "chicken"]], [/^heo_/, ["meat", "pork"]], [/^bo_nac$/, ["meat", "beef"]],
  [/^(ca_hoi|ca_ro_phi|ca_thu|ca_basa|tom|muc|ca_ngu_hop|nuoc_mam)$/, ["seafood"]],
  [/^(trung_|mayonnaise$)/, ["egg"]], [/^(sua_tuoi|sua_tach_beo|sua_chua)/, ["dairy"]],
  [/^(hat_dieu|hanh_nhan|oc_cho|dau_phong|dau_phong_rang)$/, ["nuts"]],
];
for (const f of FOODS) f.al = [...new Set(AL_RULES.filter(([re]) => re.test(f.id)).flatMap(([, a]) => a))];
const EXCL = [
  ["seafood", "Không cá & hải sản (gồm nước mắm)", ["seafood"]], ["pork", "Không thịt heo", ["pork"]], ["beef", "Không thịt bò", ["beef"]],
  ["chicken", "Không thịt gà", ["chicken"]], ["egg", "Không trứng", ["egg"]], ["dairy", "Không sữa bò, sữa chua", ["dairy"]],
  ["nuts", "Dị ứng đậu phộng, các loại hạt", ["nuts"]], ["vegetarian", "Ăn chay (vẫn ăn trứng, sữa)", ["meat", "seafood"]],
];
const SEAFOOD_TERMS = ["cá", "tôm", "cua", "ghẹ", "mực", "bạch tuộc", "nghêu", "sò", "ốc", "hến", "hải sản", "nước mắm", "mắm", "dầu hào", "dầu cá"];


;
/* PHI PHỤNG FIT — lõi tính toán (không phụ thuộc giao diện). */
/* Hạn chế ăn uống của người dùng hiện tại (nhãn trong FOODS[].al). */
let AVOID_TAGS = [];
function setAvoid(keys) {
  AVOID_TAGS = [...new Set((keys || []).flatMap((k) => (EXCL.find((e) => e[0] === k) || [, , []])[2]))];
}
const foodAllowed = (id) => !!FOOD[id] && !FOOD[id].al.some((a) => AVOID_TAGS.includes(a));
/** Thực phẩm thực dùng: nguyên liệu gốc, hoặc món thay thế khi bị kiêng; null nếu không dùng được. */
const effId = (id, alt) => (foodAllowed(id) ? id : alt && foodAllowed(alt) ? alt : null);
const recipeAllowed = (r) => r.ing.every(([id, , alt]) => effId(id, alt));
const allowedRecipes = () => RECIPES.filter(recipeAllowed);
const MEAL_KEYS = ["breakfast", "lunch", "snack", "dinner"];
const MEAL_LABEL = { breakfast: "Bữa sáng", lunch: "Bữa trưa", snack: "Bữa phụ", dinner: "Bữa tối" };

const FOOD = Object.fromEntries(FOODS.map((f) => [f.id, f]));
const RECIPE = Object.fromEntries(RECIPES.map((r) => [r.id, r]));

const r1 = (x) => Math.round(x * 10) / 10;
const zero = () => ({ k: 0, p: 0, c: 0, f: 0, fb: 0 });

/** Làm tròn gram: dưới 20 g giữ 1 g, còn lại bước 5 g. */
function roundG(g) {
  if (!isFinite(g) || g <= 0) return 0;
  return g < 20 ? Math.max(1, Math.round(g)) : Math.round(g / 5) * 5;
}

/** Dinh dưỡng của `grams` thực phẩm. Trả về null nếu thực phẩm chưa xác minh. */
function nutrOf(foodId, grams) {
  const f = FOOD[foodId];
  if (!f || !f.ver) return null;
  const m = grams / 100;
  return { k: f.k * m, p: f.p * m, c: f.c * m, f: f.f * m, fb: (f.fb || 0) * m };
}

function addN(a, b) {
  if (!b) return a;
  return { k: a.k + b.k, p: a.p + b.p, c: a.c + b.c, f: a.f + b.f, fb: a.fb + b.fb };
}
function scaleN(a, m) {
  return { k: a.k * m, p: a.p * m, c: a.c * m, f: a.f * m, fb: a.fb * m };
}
function roundN(a) {
  return { k: Math.round(a.k), p: r1(a.p), c: r1(a.c), f: r1(a.f), fb: r1(a.fb) };
}

/** Nguyên liệu thực tế của một món: áp khẩu phần (mult) và gram người dùng sửa (ov: {foodId: gram}). */
function recipeItems(recipe, mult = 1, ov = {}) {
  return recipe.ing.map(([id0, g, alt]) => {
    const id = effId(id0, alt) || id0;
    const grams = ov && ov[id] != null ? Number(ov[id]) : roundG(g * mult);
    return { id, grams, food: FOOD[id], n: nutrOf(id, grams) };
  });
}
function recipeNutrition(recipe, mult = 1, ov = {}) {
  const items = recipeItems(recipe, mult, ov);
  let t = zero();
  let weight = 0;
  for (const it of items) {
    t = addN(t, it.n);
    weight += it.grams;
  }
  return { items, total: roundN(t), weight: Math.round(weight) };
}

/* ---------- Quy đổi mua hàng: chín → sống, phần bỏ đi ---------- */
/** Trả về lượng cần mua (theo khối lượng lúc mua, đã tính phần bỏ đi) cho `grams` thực phẩm ở trạng thái công thức. */
function toPurchase(foodId, grams) {
  const f = FOOD[foodId];
  if (!f) return null;
  let buyId = foodId;
  let edible = grams;
  if (f.buy) {
    buyId = f.buy.id;
    edible = grams * f.buy.f;
  }
  const bf = FOOD[buyId];
  const asBought = edible / (1 - (bf.w || 0));
  return { buyId, edible, asBought };
}

/** Lượng có sẵn trong tủ lạnh, quy về cùng cơ sở "khối lượng lúc mua" của thực phẩm cần mua. */
function pantryAvailable(pantry) {
  const out = {};
  for (const p of pantry || []) {
    if (!p.foodId || !(p.qty > 0)) continue;
    const f = FOOD[p.foodId];
    if (!f) continue;
    let id = p.foodId;
    let g = p.qty;
    if (f.buy) {
      // đồ đã nấu chín còn trong tủ: quy về lượng sống tương đương
      id = f.buy.id;
      g = (p.qty * f.buy.f) / (1 - (FOOD[id].w || 0));
    }
    out[id] = (out[id] || 0) + g;
  }
  return out;
}

/**
 * Tổng hợp nguyên liệu cần mua.
 * entries: [{recipe, mult, ov, label}] — mỗi bữa trong khoảng ngày đã chọn.
 * Trả về danh sách gộp theo thực phẩm cần mua.
 */
function aggregateGrocery(entries, pantry) {
  const map = {};
  for (const e of entries) {
    for (const it of recipeItems(e.recipe, e.mult, e.ov)) {
      if (it.grams <= 0) continue;
      const pu = toPurchase(it.id, it.grams);
      if (!pu) continue;
      const row = (map[pu.buyId] ||= { id: pu.buyId, needG: 0, used: zero(), uses: 0, recipes: new Set(), unverified: false });
      row.needG += pu.asBought;
      row.uses += 1;
      row.recipes.add(e.recipe.n);
      if (it.n) row.used = addN(row.used, it.n);
      else row.unverified = true;
    }
  }
  const have = pantryAvailable(pantry);
  return Object.values(map)
    .map((r) => {
      const haveG = have[r.id] || 0;
      return {
        id: r.id,
        needG: Math.round(r.needG),
        haveG: Math.round(haveG),
        buyG: Math.max(0, Math.round(r.needG - haveG)),
        used: roundN(r.used),
        uses: r.uses,
        recipes: [...r.recipes],
        unverified: r.unverified,
      };
    })
    .sort((a, b) => FOOD_GROUPS.indexOf(FOOD[a.id].g) - FOOD_GROUPS.indexOf(FOOD[b.id].g) || FOOD[a.id].n.localeCompare(FOOD[b.id].n, "vi"));
}

/** Đơn vị mua: "≈ 3 quả" cho trứng, sữa hộp... */
function pieceText(foodId, grams) {
  const f = FOOD[foodId];
  if (!f || !f.pc || grams <= 0) return "";
  const n = Math.ceil((grams / f.pc.g) * 10 - 0.5) / 10;
  const whole = Math.ceil(grams / f.pc.g - 0.05);
  return `≈ ${whole} ${f.pc.l}` + (Math.abs(n - whole) > 0.25 ? ` (${String(n).replace(".", ",")} ${f.pc.l})` : "");
}

/** Xem trước lượng trừ khỏi tủ lạnh khi xác nhận đã nấu một món. Không thay đổi dữ liệu. */
function deductPreview(recipe, mult, ov, pantry) {
  const out = [];
  const left = (pantry || []).map((p) => ({ ...p }));
  for (const it of recipeItems(recipe, mult, ov)) {
    if (it.grams <= 0) continue;
    // 1) cùng thực phẩm, cùng trạng thái (vd. cơm chín còn trong tủ)
    // đồ sống trong tủ được nhập theo khối lượng lúc mua → cộng phần bỏ đi
    const fac = it.food.buy ? 1 : 1 / (1 - (it.food.w || 0));
    let need = it.grams;
    for (const p of left) {
      if (need <= 0) break;
      if (p.foodId === it.id && p.qty > 0) {
        const d = Math.min(p.qty, need * fac);
        p.qty -= d;
        need -= d / fac;
        out.push({ pantryId: p.id, foodId: p.foodId, name: p.name || FOOD[p.foodId].n, deduct: Math.round(d) });
      }

function alertHTML(a) {
  if (!a) return "";
  return `<div class="alert ${a.level}" role="${a.level === "emergency" ? "alert" : "status"}">${ic("alert", 22)}<div class="stack-s"><h3>${esc(a.title)}</h3><p>${esc(a.message)}</p>${a.level === "emergency" ? `<p class="small"><b>Số cấp cứu tại Việt Nam: 115</b></p>` : ""}</div></div>`;
}

function bottleSVG(pct) {
  const y = 140 - 124 * clamp(pct, 0, 1);
  const shape = "M36 6h24v13c0 5 16 11 16 26v90a9 9 0 0 1-9 9H29a9 9 0 0 1-9-9V45c0-15 16-21 16-26z";
  return `<svg class="bottle" viewBox="0 0 96 150" role="img" aria-label="Bình nước, đạt ${Math.round(clamp(pct, 0, 1) * 100)}% mục tiêu">
    <defs><clipPath id="bclip"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#bclip)"><rect width="96" height="150" style="fill:var(--surface-2)"/>
      <g style="transform:translateY(${y}px);transition:transform .9s cubic-bezier(.2,.8,.2,1)"><path class="wave" d="M0 6 Q20 0 40 6 T80 6 T120 6 T160 6 T200 6 V220 H0Z" style="fill:var(--water)"/></g></g>
    <path d="${shape}" fill="none" style="stroke:var(--faint)" stroke-width="2"/>
    <rect x="34" y="1" width="28" height="7" rx="3" style="fill:var(--faint)"/>
  </svg>`;
}

function pageToday() {
  const seg = `<div class="seg" role="group" aria-label="Chế độ xem">${[["overview", "Tổng quan"], ["log", "Nhật ký"]].map(([k, t]) => `<button data-act="today-seg" data-v="${k}" aria-pressed="${UI.todaySeg === k}">${t}</button>`).join("")}</div>`;
  return seg + (UI.todaySeg === "log" ? todayLog() : todayOverview());
}

function todayOverview() {
  const s = ST(), d = today(), st = dayStats(d), raw = journeyRaw();
  const out = [];
  out.push(alertHTML(recentAlert()));
  if (!profileReady()) out.push(`<div class="alert info">${ic("info", 22)}<div class="stack-s"><p>Bạn chưa điền đủ hồ sơ nên mục tiêu đang là số mặc định.</p><button class="btn sm primary" data-act="replay-onb">Điền hồ sơ</button></div></div>`);
  if (raw < 1) out.push(`<div class="alert info">${ic("info", 22)}<p>Hành trình bắt đầu vào ${longDate(startDate())}. Bạn vẫn có thể ghi nhận trước.</p></div>`);
  if (raw > 90) out.push(`<div class="alert info">${ic("info", 22)}<p>Bạn đã đi hết 90 ngày. Xem báo cáo ở tab Tiến độ, hoặc đặt ngày bắt đầu mới trong Cá nhân.</p></div>`);
  const e = !st.hasMeals, tgt = calTarget();
  out.push(`<section class="card dials" aria-label="Chỉ số hôm nay">
    <button class="dial" data-act="tab-today-log">${ring({ value: st.total.p, max: s.proMax, cls: "s-pro", unit: "g", empty: e })}<span class="lbl c-pro">Protein</span><span class="sub">${s.proMin}–${s.proMax} g</span></button>
    <button class="dial" data-act="tab-today-log">${ring({ value: st.total.k, max: tgt, cls: "s-kcal", size: 150, stroke: 12, big: true, unit: "kcal", empty: e && !st.drink.k })}<span class="lbl c-kcal">Calo</span><span class="sub">${fmt(s.calMin)}–${fmt(s.calMax)}</span></button>
    <button class="dial" data-act="quick-drink">${ring({ value: st.water, max: s.fluidRestricted ? 0 : s.waterTarget, cls: "s-water", unit: "ml", empty: !st.hasDrinks })}<span class="lbl c-water">Nước lọc</span><span class="sub">${s.fluidRestricted ? "Theo chỉ định" : fmt(s.waterTarget) + " ml"}</span></button>
  </section>`);
  out.push(`<section class="card"><div class="mini-dials">
    <div class="dial">${ring({ value: st.total.c, max: s.carbMax, cls: "s-carb", size: 80, stroke: 8, unit: "g", empty: e })}<span class="lbl c-carb">Carb</span><span class="sub">${s.carbMin}–${s.carbMax}</span></div>
    <div class="dial">${ring({ value: st.total.f, max: s.fatMax, cls: "s-fat", size: 80, stroke: 8, unit: "g", empty: e })}<span class="lbl c-fat">Fat</span><span class="sub">${s.fatMin}–${s.fatMax}</span></div>
    <div class="dial">${ring({ value: st.total.fb, max: s.fiber, cls: "s-pro", size: 80, stroke: 8, unit: "g", empty: e })}<span class="lbl">Chất xơ</span><span class="sub">~${s.fiber} g</span></div>
    <div class="dial">${ring({ value: st.fluid, max: s.fluidRestricted ? 0 : s.waterTarget, cls: "s-water", size: 80, stroke: 8, unit: "ml", empty: !st.hasDrinks })}<span class="lbl">Chất lỏng</span><span class="sub">tổng</span></div>
  </div>${calorieSummary(st)}</section>`);
  out.push(mealsTodayCard(journeyDay(), d, st));
  out.push(waterCard(st));
  out.push(lifeCard(d));
  out.push(checklistCard(d, st));
  out.push(scheduleCard(d));
  out.push(journeyCard());
  out.push(coachCard());
  const exp = expiringItems();
  if (exp.length) out.push(`<section class="card"><div class="card-head"><h2>Tủ lạnh</h2><span class="chip warn">${exp.length} món sắp hết hạn</span></div><p class="small">${exp.slice(0, 4).map((p) => esc(p.name || FOOD[p.foodId]?.n)).join(", ")}${exp.length > 4 ? "…" : ""}</p><button class="btn sm" data-act="go-pantry">Mở tủ lạnh</button></section>`);
  return out.join("");
}

function calorieSummary(st) {
  const s = ST();
  if (!st.hasMeals && !st.drink.k) return `<div class="note">Chưa ghi nhận bữa ăn hôm nay. Điều này không có nghĩa là bạn chưa ăn — ghi lại khi tiện nhé.</div>`;
  const k = st.total.k, tgt = calTarget();
  const msg = k < s.calMin ? `Còn khoảng <b>${fmt(tgt - k)} kcal</b> để tới mục tiêu ${fmt(tgt)} kcal.` : k <= s.calMax ? "Bạn đang trong khoảng mục tiêu hôm nay." : `Cao hơn khoảng mục tiêu ${fmt(k - s.calMax)} kcal. Không sao, ngày mai tiếp tục nhịp của bạn.`;
  const late = new Date().getHours() >= 20 && k < s.calMin - 300 && st.hasMeals;
  return `<div class="grid3">
    <div class="stat"><span class="v">${fmt(tgt)}</span><span class="k">Mục tiêu</span></div>
    <div class="stat"><span class="v c-kcal">${fmt(k)}</span><span class="k">Đã ghi${st.drink.k ? ` · uống ${fmt(st.drink.k)}` : ""}</span></div>
    <div class="stat"><span class="v">${k <= tgt ? fmt(tgt - k) : "0"}</span><span class="k">Còn lại</span></div>
  </div><p class="small muted">${msg}</p>
  ${st.unknownDrinks ? `<p class="small c-carb">${st.unknownDrinks} đồ uống chưa rõ calo nên chưa được tính.</p>` : ""}
  ${late ? `<div class="note">Hôm nay bạn mới ghi nhận khá ít năng lượng. Ăn đủ giúp cơ thể khỏe và giảm cân bền vững hơn; ứng dụng không khuyến khích nhịn ăn.</div>` : ""}`;
}

/** Chip chọn bữa trong ngày, dùng chung cho Hôm nay và Thực đơn. */
function patternChips(day) {
  const act = activeSlots(day);
  return `<div class="stack-s"><span class="small muted">Hôm nay bạn ăn những bữa nào?</span>
    <div class="pcf" role="group" aria-label="Chọn bữa">${MEAL_KEYS.map((k) => `<button class="fchip" data-act="pat-toggle" data-day="${day}" data-slot="${k}" aria-pressed="${act.includes(k)}">${act.includes(k) ? "✓ " : ""}${MEAL_LABEL[k].replace("Bữa ", "")}</button>`).join("")}</div>
    <div class="filters">${PATTERNS.map(([k, t, slots]) => `<button class="fchip" data-act="pat-preset" data-day="${day}" data-v="${k}" aria-pressed="${slots.join() === act.join()}">${t}</button>`).join("")}</div></div>`;
}
function mealsTodayCard(day, date, st) {
  const dp = dayPlan(day);
  const rows = MEAL_KEYS.map((k) => {
    const ps = dp.slots[k];
    if (!ps) return "";
    if (ps.skipped) return `<div class="item" style="opacity:.6"><div class="thumb">–</div><div class="item-main"><span class="item-title">${MEAL_LABEL[k]}</span><span class="item-sub">Bỏ bữa hôm nay</span></div><button class="btn sm ghost" data-act="pat-toggle" data-day="${day}" data-slot="${k}">Thêm lại</button></div>`;
    const n = slotNutrition(ps).total;
    const eaten = st.meals.some((m) => m.slot === k);
    return `<div class="item"><button class="thumb" style="cursor:pointer" data-act="open-slot" data-day="${day}" data-slot="${k}" aria-label="Xem ${esc(ps.recipe.n)}">${ps.recipe.e}</button><button class="item-main" style="background:none;border:0;padding:0;text-align:left" data-act="open-slot" data-day="${day}" data-slot="${k}"><span class="eyebrow">${MEAL_LABEL[k]}${ps.scaled ? " · đã tăng khẩu phần" : ""}</span><span class="item-title">${esc(ps.recipe.n)}</span><span class="item-sub"><span class="c-kcal">${fmt(n.k)} kcal</span> · P ${fmt(n.p)} · C ${fmt(n.c)} · F ${fmt(n.f)}</span></button>
      ${eaten ? `<span class="done-tag">${ic("check", 14)} Đã ghi</span>` : `<button class="btn sm primary" data-act="eat-slot" data-day="${day}" data-slot="${k}" aria-label="Đã ăn ${MEAL_LABEL[k]}">Đã ăn</button>`}</div>`;
  }).join("");
  return `<section class="card"><div class="card-head"><h2>Bữa hôm nay</h2><button class="link" data-act="tab" data-v="plan">Đổi món</button></div>
    ${patternChips(day)}
    <div class="list">${rows}</div>
    ${dp.short > 120 ? `<p class="small c-carb">Với ${dp.active.length} bữa, khẩu phần đã tăng tối đa nhưng vẫn thiếu khoảng ${fmt(dp.short)} kcal so với mục tiêu. Nên thêm một bữa phụ để không ăn quá ít.</p>` : dp.active.length < dp.all.length ? `<p class="tiny muted">Calo của bữa đã bỏ được chia lại cho các bữa còn lại (mỗi bữa tối đa ×1,8 khẩu phần).</p>` : ""}
    <button class="btn sm ghost" data-act="add-meal" data-slot="${nextSlot()}" data-date="${date}">${ic("plus", 16)} Ghi món khác ngoài thực đơn</button></section>`;
}

function lifeCard(d) {
  const j = journalOf(d), todos = j.todos || [];
  return `<section class="card"><div class="card-head"><h2>Hôm nay của bạn</h2></div>
    <div class="stack-s"><span class="small muted">Tâm trạng</span><div class="pcf" role="group" aria-label="Tâm trạng">${MOODS2.map(([k, e, t]) => `<button class="fchip" data-act="j-mood" data-v="${k}" aria-pressed="${j.mood === k}" style="min-height:44px">${e} ${t}</button>`).join("")}</div></div>
    <div class="stack-s"><span class="small muted">Công việc hôm nay</span><div class="seg" role="group" aria-label="Công việc">${WORKS.map(([k, t]) => `<button data-act="j-work" data-v="${k}" aria-pressed="${j.work === k}">${t}</button>`).join("")}</div>
      <input class="input" data-change="j-note" id="j-note" value="${esc(j.workNote || "")}" placeholder="Ghi nhanh: hôm nay đi làm thế nào?"></div>
    <div class="stack-s"><span class="small muted">3 việc quan trọng nhất</span>
      <div class="list">${todos.map((t, i) => `<div class="item"><button class="g-check" data-act="todo-toggle" data-i="${i}" aria-label="${t.done ? "Bỏ đánh dấu" : "Đánh dấu xong"} ${esc(t.t)}"><span class="box ${t.done ? "on" : ""}">${ic("check", 16)}</span></button><span class="grow" style="${t.done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(t.t)}</span><button class="icon-btn" data-act="todo-del" data-i="${i}" aria-label="Xóa">${ic("x", 18)}</button></div>`).join("")}</div>
      ${todos.length < 3 ? `<div class="row"><input class="input grow" id="todo-in" placeholder="${todos.length ? "Thêm việc khác" : "Việc quan trọng nhất hôm nay là…"}"><button class="btn" data-act="todo-add">Thêm</button></div>` : ""}</div>
    <label class="field"><span>Một điều ý nghĩa hoặc biết ơn hôm nay</span><input class="input" data-change="j-grat" id="j-grat" value="${esc(j.gratitude || "")}" placeholder="Ví dụ: được ăn cơm cùng gia đình"></label>
    ${["sad", "stress"].includes(j.mood) ? `<p class="small muted">Ngày không vui cũng là một phần của hành trình. Thử uống một ly nước, đi bộ vài phút hoặc nói chuyện với người bạn tin tưởng nhé.</p>` : ""}</section>`;
}
function scheduleCard(d) {
  const now = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const items = daySchedule(d);
  const next = items.find((x) => x.t >= now);
  return `<section class="card"><div class="card-head"><h2>Lịch hôm nay</h2><button class="link" data-act="edit-profile">Đổi giờ</button></div>
    <div class="list">${items.map((x) => `<div class="kv" style="${x === next ? "color:var(--fg);font-weight:600" : x.t < now ? "color:var(--muted)" : ""}"><span>${x.ico} ${esc(x.label)}${x === next ? " · tiếp theo" : ""}</span><b>${x.t}</b></div>`).join("")}</div></section>`;
}

function journeyCard() {
  const s = ST(), day = journeyDay(), lw = latestWeight();
  const change = lw && s.startWeightKg ? r1(lw.kg - s.startWeightKg) : null;
  return `<section class="card"><div class="card-head"><h2>Hành trình</h2><span class="eyebrow">Tuần ${Math.ceil(day / 7)}/13</span></div>
    <div class="row between"><div class="progress-big"><span class="num">${day}</span><span class="muted num" style="font-size:20px">/ 90 ngày</span></div><span class="chip ok">${ic("flame", 14)} ${streak()} ngày liên tục</span></div>
    <div class="bar c-brand"><i style="width:${(day / 90) * 100}%"></i></div>
    <div class="grid3">
      <div class="stat"><span class="v">${lw ? fmt(lw.kg, 1) : s.startWeightKg ? fmt(s.startWeightKg, 1) : "—"}<small>kg</small></span><span class="k">${lw ? `Cân ngày ${dm(lw.date)}${change != null ? ` · ${change > 0 ? "+" : ""}${fmt(change, 1)}` : ""}` : "Lúc bắt đầu"}</span></div>
      <div class="stat"><span class="v c-pro">${s.safeMin ? `${fmt(s.safeMin, 1)}–${fmt(s.safeMax, 1)}` : "—"}<small>kg</small></span><span class="k">Dự kiến sau 90 ngày</span></div>
      <div class="stat"><span class="v">${s.goalKg ? fmt(s.goalKg, 1) : "—"}<small>kg</small></span><span class="k">Mục tiêu của bạn</span></div>
    </div>
    <button class="btn sm" data-act="quick-weight">${ic("scale", 16)} Ghi cân nặng</button></section>`;
}

function waterCard(st) {
  const s = ST();
  const pct = s.fluidRestricted ? 0 : st.water / s.waterTarget;
  const low = !s.fluidRestricted && new Date().getHours() >= 15 && st.fluid < 500;
  const last = st.drinks.slice(-3).reverse();
  return `<section class="card"><div class="card-head"><h2>Nước uống</h2><button class="link" data-act="quick-drink">Đồ uống khác</button></div>
    <div class="bottle-wrap">${bottleSVG(pct)}<div class="stack-s">
      <div class="stat"><span class="v c-water">${fmt(st.water)}<small>ml nước lọc</small></span><span class="k">${s.fluidRestricted ? "Đang theo chỉ định hạn chế dịch — chỉ ghi nhận, không đặt mục tiêu" : `Mục tiêu ${fmt(s.waterTarget)} ml`}</span></div>
      <div class="kv"><span>Tổng chất lỏng</span><b>${fmt(st.fluid)} ml</b></div>
      ${last.length ? `<p class="tiny muted">${last.map((d) => `${hhmm(d.createdAt)} ${esc(drinkLabel(d.type))} ${fmt(d.ml)} ml`).join(" · ")}</p>` : `<p class="tiny muted">Chưa ghi nhận đồ uống hôm nay.</p>`}
    </div></div>
    <div class="filters" role="group" aria-label="Loại đồ uống">${DRINKS.slice(0, 6).map(([k, t]) => `<button class="fchip" data-act="drink-type" data-v="${k}" aria-pressed="${UI.drinkType === k}">${t}</button>`).join("")}</div>
    <div class="quick4">${[50, 100, 150, 250].map((ml) => `<button class="btn" data-act="add-water" data-ml="${ml}" aria-label="Thêm ${ml} ml ${esc(drinkLabel(UI.drinkType))}">+${ml}</button>`).join("")}</div>
    <button class="btn ghost sm" data-act="quick-drink">Tự nhập lượng khác</button>
    ${low ? `<div class="note">Bạn mới ghi nhận khá ít chất lỏng hôm nay. Nếu bạn khát nhiều, chóng mặt, tiểu rất ít hoặc nước tiểu sẫm màu, hãy cân nhắc liên hệ nhân viên y tế.</div>` : ""}
  </section>`;
}

const pcf = (n, extra = "") => `<div class="pcf"><span class="chip k">${fmt(n.k)} kcal</span><span class="chip p">P ${fmt(n.p, 1)}g</span><span class="chip c">C ${fmt(n.c, 1)}g</span><span class="chip f">F ${fmt(n.f, 1)}g</span>${extra}</div>`;

function checklistCard(d, st) {
  const hp = habitProgress(d), list = habitsFor(d);
  const shown = UI.allHabits ? list : list.slice(0, 6);
  return `<section class="card"><div class="card-head"><h2>Checklist hôm nay</h2><span class="num" style="font-size:20px">${hp.done}/${hp.total}</span></div>
    <div class="bar c-pro"><i style="width:${hp.total ? (hp.done / hp.total) * 100 : 0}%"></i></div>
    <div class="list">${shown.map((h) => `<label class="check"><input type="checkbox" data-change="habit" data-k="${h.k}" data-date="${d}" ${habitDone(d, h, st) ? "checked" : ""}><span class="box">${ic("check", 16)}</span><span class="grow">${esc(h.t)}</span></label>`).join("")}</div>
    <div class="btns">${list.length > 6 ? `<button class="btn sm ghost" data-act="habits-all">${UI.allHabits ? "Thu gọn" : `Xem tất cả ${list.length} mục`}</button>` : ""}<button class="btn sm ghost" data-act="habits-manage">${ic("edit", 16)} Tự tạo thói quen</button></div>
    <p class="tiny muted">Ô tự đánh dấu khi bạn ghi bữa ăn, nước, cân nặng, tâm trạng. Bạn vẫn có thể tự bật/tắt.</p></section>`;
}

/* ---------- Nhật ký ---------- */
function todayLog() {
  const d = UI.logDate, st = dayStats(d);
  const isToday = d === today();
  const out = [`<div class="row between"><button class="icon-btn boxed" data-act="log-prev" aria-label="Ngày trước">${ic("chevL")}</button><div class="stack-s" style="align-items:center"><b>${isToday ? "Hôm nay" : longDate(d)}</b><span class="tiny muted">Ngày ${journeyRaw(d)} của hành trình</span></div><button class="icon-btn boxed" data-act="log-next" aria-label="Ngày sau" ${isToday ? "disabled" : ""}>${ic("chevR")}</button></div>`];
  out.push(`<section class="card"><div class="row between"><span class="eyebrow">Tổng đã ghi</span>${st.hasMeals || st.drink.k ? pcf(st.total) : `<span class="small muted">Chưa ghi nhận bữa ăn</span>`}</div></section>`);
  for (const k of MEAL_KEYS) {
    const list = st.meals.filter((m) => m.slot === k);
    const sum = roundN(list.reduce((a, m) => addN(a, m), { k: 0, p: 0, c: 0, f: 0, fb: 0 }));
    out.push(`<section class="card"><div class="card-head"><h2>${MEAL_LABEL[k]}</h2>${list.length ? `<span class="chip k">${fmt(sum.k)} kcal</span>` : ""}</div>
      ${list.length ? `<div class="list">${list.map((m) => `<div class="item"><div class="item-main"><span class="item-title">${esc(m.name)}</span><span class="item-sub">${sourceLabel(m)} · P ${fmt(m.p, 1)} · C ${fmt(m.c, 1)} · F ${fmt(m.f, 1)}</span></div><span class="num c-kcal" style="font-size:18px">${fmt(m.k)}</span><button class="icon-btn" data-act="fav-meal" data-id="${m.id}" data-date="${d}" aria-label="Lưu món yêu thích">${ic("heart", 18)}</button><button class="icon-btn" data-act="edit-meal" data-id="${m.id}" data-date="${d}" aria-label="Sửa">${ic("edit", 18)}</button><button class="icon-btn" data-act="del-meal" data-id="${m.id}" data-date="${d}" aria-label="Xóa">${ic("trash", 18)}</button></div>`).join("")}</div>` : `<p class="small muted">Chưa ghi.</p>`}
      <div class="btns"><button class="btn sm" data-act="add-meal" data-slot="${k}" data-date="${d}">${ic("plus", 16)} Thêm</button><button class="btn sm ghost" data-act="copy-prev" data-slot="${k}" data-date="${d}">${ic("copy", 16)} Sao chép bữa trước</button></div></section>`);
  }
  out.push(`<section class="card"><div class="card-head"><h2>Đồ uống</h2><button class="link" data-act="quick-drink" data-date="${d}">+ Thêm</button></div>

async function loadScript(src) {
  if ([...document.scripts].some((s) => s.src === src)) return;
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function groceryPDF(text, filename) {
  toast("Đang tạo PDF…");
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try { await document.fonts.load('600 30px "Be Vietnam Pro"'); await document.fonts.load('30px "Be Vietnam Pro"'); } catch {}
    const W = 1240, H = 1754, M = 96, LH = 46;
    const pages = [];
    let cv, cx, y;
    const page = () => { cv = document.createElement("canvas"); cv.width = W; cv.height = H; cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, W, H); cx.fillStyle = "#0c0e10"; cx.textBaseline = "top"; y = M; pages.push(cv); };
    page();
    const lines = text.split("\n");
    lines.forEach((ln, i) => {
      const head = i === 0 || (ln && ln === ln.toUpperCase() && !/^[☐☑◻]/.test(ln) && !/\d/.test(ln.slice(0, 2)));
      cx.font = `${head ? "700" : "400"} ${i === 0 ? 40 : head ? 30 : 28}px "Be Vietnam Pro", Arial, sans-serif`;
      const words = ln.split(" ");
      let cur = "";
      const out = [];
      for (const w of words) { const t = cur ? cur + " " + w : w; if (cx.measureText(t).width > W - 2 * M && cur) { out.push(cur); cur = w; } else cur = t; }
      out.push(cur);
      for (const o of out) { if (y + LH > H - M) page(); cx.font = `${head ? "700" : "400"} ${i === 0 ? 40 : head ? 30 : 28}px "Be Vietnam Pro", Arial, sans-serif`; cx.fillText(o, M, y); y += i === 0 ? 60 : LH; }
    });
    const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    pages.forEach((p, i) => { if (i) pdf.addPage(); pdf.addImage(p.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 595.28, 841.89); });
    await saveFile(filename, pdf.output("blob"));
  } catch { toast("Không tạo được PDF lúc này"); }
}

function weightCard() {
  const s = ST(), ws = weightsSorted();
  const jd = journeyDay();

  const pts = ws.map((w) => ({ ...w, day: journeyRaw(w.date) })).filter((w) => w.day >= span[0] && w.day <= span[1]);
  const trend = weightTrend(ws.map((w) => ({ day: journeyRaw(w.date), weightKg: w.kg })));
  const lw = ws.slice(-1)[0];
  const W = 340, H = 210, L = 34, R = 10, T = 12, B = 26;
  const vals = [...pts.map((p) => p.kg), s.startWeightKg, s.safeMin, s.safeMax, s.goalKg].filter((x) => x > 0);
  if (!vals.length) vals.push(50, 60);
  if (trend) vals.push(trend.at(span[1]));
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const step = hi - lo > 10 ? 2 : 1;
  const x = (d) => L + ((d - span[0]) / Math.max(1, span[1] - span[0])) * (W - L - R);
  const y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const ticks = UI.wr === 30 ? [span[0], span[0] + 10, span[0] + 20, span[1]] : [1, 30, 60, 90];
  for (const t of ticks) g += `<text class="ch-axis" x="${x(t)}" y="${H - 8}" text-anchor="middle">N${t}</text>`;
  if (s.safeMin > 0) g += `<rect class="ch-band" x="${L}" width="${W - L - R}" y="${y(s.safeMax)}" height="${y(s.safeMin) - y(s.safeMax)}"/><text class="ch-lbl-ok" x="${L + 4}" y="${y(s.safeMax) + 11}">Dự kiến 90 ngày ${fmt(s.safeMin, 1)}–${fmt(s.safeMax, 1)}</text>`;
  if (s.goalKg > 0) g += `<line class="ch-goal" x1="${L}" x2="${W - R}" y1="${y(s.goalKg)}" y2="${y(s.goalKg)}"/><text class="ch-lbl-goal" x="${W - R - 2}" y="${y(s.goalKg) - 4}" text-anchor="end">Mong muốn ${s.goalKg}</text>`;
  if (trend) g += `<path class="ch-trend" d="M${x(span[0])},${y(trend.at(span[0]))} L${x(span[1])},${y(trend.at(span[1]))}"/>`;
  // trung bình 7 ngày (chỉ từ số liệu thật)
  const avg = pts.map((p) => { const win = pts.filter((q) => q.day <= p.day && q.day > p.day - 7); return { day: p.day, v: win.reduce((s2, q) => s2 + q.kg, 0) / win.length }; });
  if (avg.length > 1) g += `<path class="ch-avg" d="${avg.map((a, i) => `${i ? "L" : "M"}${x(a.day)},${y(a.v)}`).join(" ")}"/>`;
  if (pts.length > 1) g += `<path class="ch-line" d="${pts.map((p, i) => `${i ? "L" : "M"}${x(p.day)},${y(p.kg)}`).join(" ")}"/>`;
  pts.forEach((p, i) => { g += `<circle class="ch-pt ${UI.wsel === p.date ? "sel" : ""}" cx="${x(p.day)}" cy="${y(p.kg)}" r="${UI.wsel === p.date ? 5 : 3.5}"/><circle class="ch-hit" data-act="ch-pt" data-v="${p.date}" cx="${x(p.day)}" cy="${y(p.kg)}" r="12"><title>${dm(p.date)}: ${p.kg} kg</title></circle>`; });
  if (!pts.length && s.startWeightKg > 0) g += `<circle class="ch-pt" cx="${x(Math.max(span[0], 1))}" cy="${y(s.startWeightKg)}" r="4" style="stroke-dasharray:2 2"/><text class="ch-axis" x="${x(Math.max(span[0], 1)) + 8}" y="${y(s.startWeightKg) + 4}">Lúc bắt đầu ${s.startWeightKg} kg (bạn nhập)</text>`;
  const sel = ws.find((w) => w.date === UI.wsel) || lw;

  return `<section class="card"><div class="card-head"><h2>Cân nặng</h2><div class="seg" style="width:140px">${[30, 90].map((r) => `<button data-act="wr" data-v="${r}" aria-pressed="${UI.wr === r}">${r} ngày</button>`).join("")}</div></div>
    <div class="grid3"><div class="stat"><span class="v">${lw ? fmt(lw.kg, 1) : "—"}<small>kg</small></span><span class="k">Thực tế gần nhất</span></div>
    <div class="stat"><span class="v">${lw && s.startWeightKg ? `${lw.kg - s.startWeightKg > 0 ? "+" : ""}${fmt(lw.kg - s.startWeightKg, 1)}` : "—"}<small>kg</small></span><span class="k">So với lúc đầu ${s.startWeightKg ? fmt(s.startWeightKg, 1) + " kg" : "—"}</span></div>
    <div class="stat"><span class="v">${trend ? `${trend.perWeek > 0 ? "+" : ""}${fmt(trend.perWeek, 2)}` : "—"}<small>kg/tuần</small></span><span class="k">Xu hướng</span></div></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cân nặng">${g}</svg></div>
    <div class="legend"><span style="color:var(--fg)"><i></i>Cân thực tế</span><span style="color:var(--water)"><i></i>TB 7 ngày</span>${trend ? `<span style="color:var(--carb)"><i></i>Xu hướng</span>` : ""}<span style="color:var(--ok)"><i></i>Dự kiến 90 ngày</span><span style="color:var(--brand)"><i></i>Mong muốn</span></div>

  const avoid = (s.avoid || []).map((k) => EXCL.find((e) => e[0] === k)?.[1]).filter(Boolean);
  const act = ACTIVITY.find((a) => a[0] === s.activity)?.[1] || "chưa rõ", job = JOBS.find((j) => j[0] === s.job)?.[1] || "chưa rõ";
  return `Bạn là PHỤNG COACH, trợ lý chăm sóc bản thân thân thiện, dễ thương, không phán xét, nói tiếng Việt, xưng "mình" và gọi người dùng là "${nm}".
Hồ sơ: ${s.sex}, ${s.age || "?"} tuổi, cao ${s.heightCm || "?"} cm, cân lúc bắt đầu ${s.startWeightKg || "?"} kg, mong muốn ${s.goalKg || "?"} kg; vận động: ${act}; công việc: ${job}; thức ${s.wake || "?"}, ngủ ${s.sleep || "?"}.
Tính toán: BMR ${t.bmr} kcal, TDEE ${t.tdee} kcal, mức sàn an toàn ${t.floor} kcal. Nhịp: ${t.paceLabel}. Dự kiến sau 90 ngày ${s.safeMin || "?"}–${s.safeMax || "?"} kg.
Mục tiêu mỗi ngày: ${s.calMin}–${s.calMax} kcal, protein ${s.proMin}–${s.proMax} g, carb ${s.carbMin}–${s.carbMax} g, fat ${s.fatMin}–${s.fatMax} g, chất xơ ~${s.fiber} g, nước lọc ${s.fluidRestricted ? "theo chỉ định bác sĩ (đang hạn chế dịch)" : s.waterTarget + " ml"}. Bữa thường ăn: ${(s.mealPattern || MEAL_KEYS).map((k) => MEAL_LABEL[k]).join(", ")}.
Thói quen tự mô tả: ${s.habitNotes || "chưa ghi"}. Sức khỏe: ${[...(s.conditions || []), s.healthNotes].filter(Boolean).join("; ") || "chưa ghi"}${s.pregnant ? "; đang mang thai" : ""}${s.breastfeeding ? "; đang cho con bú" : ""}${s.edHistory ? "; từng rối loạn ăn uống — tuyệt đối không khuyến khích giảm calo, không nói về con số calo thấp" : ""}.
QUY TẮC BẮT BUỘC:
- Kiêng: ${avoid.length ? avoid.join(", ") : "không có"}.${(s.avoid || []).includes("seafood") ? " Không gợi ý cá, hải sản, nước mắm, dầu hào, dầu cá; nhắc đọc nhãn gia vị." : ""}${s.dislikes ? ` Không thích: ${s.dislikes}.` : ""}
- Không chẩn đoán bệnh. Tê/yếu tay chân, đau ngực, chóng mặt kéo dài: khuyên đi khám sớm. Yếu chân tăng nhanh, mất khả năng đi lại, bí tiểu, tiểu không tự chủ, tê vùng bẹn, đau ngực dữ dội, khó thở: bảo gọi 115 hoặc đến cấp cứu ngay.
- Không đề xuất tập nặng khi có triệu chứng chưa được đánh giá; ưu tiên vận động nhẹ như đi bộ.
- Không bao giờ đề xuất dưới ${t.floor} kcal/ngày, không nhịn ăn cực đoan, không thuốc giảm cân, không giảm quá 1% cân nặng mỗi tuần.
- Không bịa giá tiền; chỉ dùng giá người dùng đã nhập. Không đặt mua hàng.
- Hỗ trợ cả đời sống: tâm trạng, công việc, kế hoạch trong ngày, giấc ngủ — nhẹ nhàng, khích lệ, cụ thể.
- Trả lời ngắn gọn, thực tế, ưu tiên món Việt nhà làm, nguyên liệu chợ bình dân.`;
}
function coachContext() {
  const d = today(), st = dayStats(d), day = journeyDay();
  const plan = activeSlots(day).map((k) => { const ps = planSlot(day, k); return ps && !ps.skipped ? `${MEAL_LABEL[k]}: ${ps.recipe.n} (${slotNutrition(ps).total.k} kcal)` : ""; }).filter(Boolean).join("; ");
  const ws = weightsSorted().slice(-8).map((w) => `${w.date}: ${w.kg} kg`).join(", ");
  const pantry = S.pantry.items.filter((p) => p.qty > 0).map((p) => `${p.name || FOOD[p.foodId]?.n} ${fmt(p.qty)} ${p.unit || FOOD[p.foodId]?.u || "g"}${p.expiry ? ` (HSD ${p.expiry})` : ""}`).join(", ");
  const j = journalOf(d);
  return `Hôm nay ${d}, ngày ${day}/90 của hành trình. Bữa hôm nay: ${activeSlots(day).map((k) => MEAL_LABEL[k]).join(", ")}. Tâm trạng: ${MOODS2.find((m) => m[0] === j.mood)?.[2] || "chưa ghi"}; công việc: ${WORKS.find((w) => w[0] === j.work)?.[1] || "chưa ghi"}${j.workNote ? ` (${j.workNote})` : ""}; việc quan trọng: ${(j.todos || []).map((t) => (t.done ? "✓ " : "") + t.t).join(", ") || "chưa ghi"}.
Đã ghi hôm nay: ${st.hasMeals ? `${st.total.k} kcal, P ${st.total.p} g, C ${st.total.c} g, F ${st.total.f} g, ${st.slots.size} bữa` : "chưa ghi bữa nào (chưa ghi không có nghĩa là chưa ăn)"}; nước lọc ${st.water} ml, tổng chất lỏng ${st.fluid} ml.
Thực đơn hôm nay: ${plan}.
Cân gần đây: ${ws || "chưa có"}.
Tủ lạnh: ${pantry || "chưa nhập"}.
Món yêu thích: ${S.profile.favorites.map((r) => RECIPE[r]?.n).filter(Boolean).join(", ") || "chưa có"}.`;
}

async function coachSend(text) {
  if (!SAMPLE || !text.trim() || UI.chatBusy) return;
  UI.chat.push({ role: "user", content: text.trim() });
  UI.chat.push({ role: "assistant", content: "Đang nghĩ…", pending: true });
  UI.chatBusy = true; refreshSheet();
  CHAT_CTL = new AbortController();
  const turns = UI.chat.filter((m) => !m.pending && !m.err).slice(-12).map((m) => ({ role: m.role, content: m.content }));
  const msg = UI.chat[UI.chat.length - 1];
  try {
    const { text: out } = await SAMPLE([{ role: "user", content: `${coachRules()}\n\nDỮ LIỆU HIỆN TẠI:\n${coachContext()}` }, ...turns], {
      cache: false, signal: CHAT_CTL.signal,
      onText: ({ text: t }) => { msg.content = t; const els = $$(".msg.ai", SHEET?.wrap); if (els.length) els[els.length - 1].textContent = t; },
    });
    msg.content = out; delete msg.pending;
  } catch (e) {
    noteSampleError(e);
    if (e?.code === "cancelled") { msg.content = e.text || "Đã dừng."; delete msg.pending; }
    else { msg.content = e.text ? e.text + "\n\n(Bị gián đoạn) " + coachErr(e) : coachErr(e); msg.err = true; delete msg.pending; }
  }
  UI.chatBusy = false; refreshSheet();
}

  const prompt = `${coachRules()}

Trả về CHỈ một JSON object dạng:
{"dishes":[{"name":"Tên món","slot":"breakfast|lunch|snack|dinner","ingredients":[{"id":"ga_uc_song","grams":120}],"steps":["bước 1","bước 2"],"why":"lý do ngắn"}],"reuse":"nguyên liệu dùng chung giữa các món, một câu"}

DANH SÁCH THỰC PHẨM (id|tên|trạng thái|kcal/100|P|C|F|giá nếu có):
${foodCatalog()}`;
  try {
    const data = await SAMPLE.json(prompt, { cache: false });
    c.res = shapeMarketAI(data, c.usePantry);

function isBannedText(s) {
  if (!(ST().avoid || []).includes("seafood")) return false;
  const x = " " + String(s).toLowerCase().normalize("NFC") + " ";
  return SEAFOOD_TERMS.some((b) => new RegExp(`(^|[^\\p{L}])${b}([^\\p{L}]|$)`, "u").test(x));
}
function shapeMarketAI(data, usePantry) {
  const have = usePantry ? pantryAvailable(S.pantry.items) : {};
  const left = { ...have };
  let dropped = 0;
  const dishes = (Array.isArray(data?.dishes) ? data.dishes : []).slice(0, 6).filter((d) => d && !isBannedText(d.name || "")).map((d) => {
    const items = [];
    for (const it of Array.isArray(d.ingredients) ? d.ingredients : []) {
      const id = String(it?.id || ""), grams = Math.round(Number(it?.grams));
      if (!FOOD[id] || !FOOD[id].ver || !foodAllowed(id) || !(grams > 0 && grams < 2000)) { dropped++; continue; }
      const pu = toPurchase(id, grams);
      const ok = (left[pu.buyId] || 0) >= pu.asBought * 0.999;
      if (ok) left[pu.buyId] -= pu.asBought;
      items.push({ id, grams, have: ok, pu });
    }
    let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 };
    for (const it of items) t = addN(t, nutrOf(it.id, it.grams));
    const steps = (Array.isArray(d.steps) ? d.steps : []).map(String).filter((s) => !isBannedText(s)).slice(0, 8);
    return { name: String(d.name || "Món gợi ý").slice(0, 80), slot: MEAL_KEYS.includes(d.slot) ? d.slot : "", items, total: roundN(t), steps, why: isBannedText(d.why || "") ? "" : String(d.why || "").slice(0, 240), missing: items.filter((i) => !i.have) };
  }).filter((d) => d.items.length);
  if (!dishes.length) throw { code: "invalid_json" };
  const need = {};
  for (const d of dishes) for (const m of d.missing) need[m.pu.buyId] = (need[m.pu.buyId] || 0) + m.pu.asBought;
  let cost = 0, priced = 0;
  for (const [id, g] of Object.entries(need)) {
    const pr = S.profile.prices[id];
    if (pr?.vnd > 0) { priced++; cost += pr.per === "piece" && FOOD[id].pc ? pr.vnd * Math.ceil(g / FOOD[id].pc.g) : (pr.vnd * g) / 1000; }
  }
  return { dishes, reuse: isBannedText(data?.reuse || "") ? "" : String(data?.reuse || "").slice(0, 300), cost: priced ? cost : null, priced, need: Object.keys(need).length, dropped };
}
function addAIMissing(dish) {
  for (const m of dish.missing) addManualGrocery({ foodId: m.pu.buyId, name: FOOD[m.pu.buyId].n, g: m.pu.asBought, unit: FOOD[m.pu.buyId].u, src: `AI gợi ý: ${dish.name}` });
}

  "pp-save": () => {
    const c = SHEET_CTX, f = c.foodId ? FOOD[c.foodId] : null;
    const name = f ? "" : ($("#pp-name")?.value || $("#pp-q")?.value || "").trim();
    let qty = num($("#pp-qty").value);
    const pcs = num($("#pp-pc")?.value);
    if (f?.pc && pcs > 0) qty = pcs * f.pc.g;
    if (!f && !name) return err("pp-err", "Chọn thực phẩm trong thư viện hoặc nhập tên.");
    if (!(qty > 0 && qty <= 100000)) return err("pp-err", "Số lượng cần lớn hơn 0.");
    const exp = $("#pp-exp").value || null, bought = $("#pp-bought").value || today();
    if (exp && exp < bought) return err("pp-err", "Hạn sử dụng đang sớm hơn ngày mua.");
    const rec = { foodId: c.foodId || null, name, qty: Math.round(qty), unit: f?.u || "g", bought, expiry: exp, loc: $("#pp-loc").value };
    if (c.id) S.pantry.items = S.pantry.items.map((p) => (p.id === c.id ? { ...p, ...rec } : p));
    else S.pantry.items.push({ id: uid(), ...rec, initial: rec.qty });
    save("pantry"); closeSheet(); toast(c.id ? "Đã lưu" : "Đã thêm vào tủ lạnh · danh sách đi chợ được trừ tương ứng"); render();
