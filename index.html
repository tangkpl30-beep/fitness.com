  "export-json": async () => { const data = JSON.stringify({ app: "phi-phung-fit", version: 2, exportedAt: new Date().toISOString(), profile: S.profile, plan: S.plan, body: S.body, grocery: S.grocery, pantry: S.pantry, logs: S.logs }, null, 1); if (!(await saveFile(`phi-phung-fit-${today()}.json`, data))) copyText(data); },
  "import-json": () => openSheet("Khôi phục từ bản sao lưu", () => `<p class="small muted">Dán nội dung tệp sao lưu (.json) vào ô dưới. Dữ liệu hiện tại sẽ được thay thế.</p><label class="btn block" for="imp-file">${ic("download", 18)} Chọn tệp sao lưu (.json)</label><input class="hidden-file" type="file" id="imp-file" accept="application/json,.json,text/plain" data-change="imp-file"><p class="tiny muted">Hoặc dán nội dung tệp vào ô dưới.</p><textarea class="input" id="imp" rows="8"></textarea><p class="form-error" id="imp-err" hidden></p><button class="btn primary block" data-act="imp-run">Khôi phục</button>`),
  "imp-run": () => {
    let d;
    try { d = JSON.parse($("#imp").value); } catch { return err("imp-err", "Nội dung không phải JSON hợp lệ."); }
    if (d?.app !== "phi-phung-fit" || !d.profile) return err("imp-err", "Đây không phải bản sao lưu của PHI PHỤNG FIT.");
    confirmBox({ title: "Thay toàn bộ dữ liệu?", message: "Không thể hoàn tác.", ok: "Khôi phục", danger: true }, () => {
      for (const k of BUCKETS) if (d[k]) applyBucket(k, d[k]);
      for (const m of Object.keys(d.logs || {})) applyBucket("log-" + m, d.logs[m]);
      save(...allBucketKeys()); closeSheet(); applyTheme(); toast("Đã khôi phục"); render();
    });
  },
  "reset-all": () => confirmBox({ title: "Xóa toàn bộ dữ liệu?", message: "Nhật ký, cân nặng, danh sách đi chợ, tủ lạnh và cài đặt sẽ bị xóa trên mọi thiết bị. Không thể hoàn tác.", ok: "Xóa hết", danger: true }, () => {
    const months = Object.keys(S.logs);
    S.profile = { settings: DEFAULT_SETTINGS(), favorites: [], prices: {}, habits: {}, purchases: [], customHabits: [], hiddenHabits: [], sharing: { on: false, fields: { weight: true, checklist: true, water: true, meals: false, weekly: true, symptoms: false } } };
    S.plan = { ov: {}, cooked: {}, pattern: {} }; S.body = { weights: [], health: [], notes: {}, journal: {} }; S.grocery = { range: { kind: "7" }, extra: [], meta: {}, manual: [] }; S.pantry = { items: [] };
    for (const m of months) S.logs[m] = { meals: [], drinks: [] };
    revokeShare().catch(() => {});
    save(...allBucketKeys()); applyTheme(); render(); showOnboarding();
  }),
  "replay-onb": () => showOnboarding(),

  /* onboarding */
  "onb-next": () => {
    const v = ONB.v, keys = ONB_KEYS[ONB.step] || [];
    for (const k of keys) { const el = $("#pf-" + k); if (el) v[k] = num(el.value); }
    const nm = $("#pf-name"); if (nm) v.name = nm.value.trim();
    const e = pfErrors(v, keys);
    if (e.length) { const er = $("#onb-err"); if (er) { er.textContent = e[0]; er.hidden = false; } return; }
    ONB.step++; renderOnb();
  },
  "onb-back": () => { ONB.step = Math.max(0, ONB.step - 1); renderOnb(); },
  "onb-finish": () => {
    const s = ST(), v = ONB.v;
    const nt = $("#pf-healthNotes"); if (nt) v.healthNotes = nt.value.trim();
    Object.assign(s, v, { startDate: $("#onb-start")?.value || s.startDate || today(), onboarded: true, profileVersion: 2, autoTargets: true, waterManual: false });
    refreshTargets();
    save("profile");
    UI.planDay = journeyDay();
    $(".onb")?.remove(); document.body.classList.remove("locked");
    render();
    toast("Đã tạo kế hoạch riêng cho bạn");
  },
};
function openEditMeal(id, date) {
  const m = mealsOn(date).find((x) => x.id === id);
  if (!m) return;
  const c = { m, date, items: (m.items || []).filter((i) => i.id && FOOD[i.id]?.ver).map((i) => ({ ...i })) };
  SHEET_CTX = c;
  const byItems = c.items.length > 0 && c.items.length === (m.items || []).length;
  c.byItems = byItems;
  openSheet("Sửa món", () => {
    let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 };
    if (byItems) for (const it of c.items) t = addN(t, nutrOf(it.id, it.g));
    return `<label class="field"><span>Tên món</span><input class="input" id="em-name" value="${esc(m.name)}"></label>
      <label class="field"><span>Bữa</span><select class="input" id="em-slot">${MEAL_KEYS.map((k) => `<option value="${k}" ${k === m.slot ? "selected" : ""}>${MEAL_LABEL[k]}</option>`).join("")}</select></label>
      ${byItems ? `<p class="section-title">Khẩu phần (gram)</p><div class="list">${c.items.map((it, i) => `<div class="item"><div class="thumb">${FOOD[it.id].e}</div><span class="item-title grow">${esc(FOOD[it.id].n)}</span><input class="input" style="width:84px;text-align:right" inputmode="decimal" data-input="em-g" data-i="${i}" value="${it.g}" aria-label="Gram ${esc(FOOD[it.id].n)}"></div>`).join("")}</div><div class="nut4" id="em-nut">${nut4(roundN(t))}</div>`
      : `<div class="grid2">${[["k", "Calo"], ["p", "Protein (g)"], ["c", "Carb (g)"], ["f", "Fat (g)"]].map(([k, l]) => `<label class="field"><span>${l}</span><input class="input" id="em-${k}" inputmode="decimal" value="${m[k] ?? 0}"></label>`).join("")}</div>`}
      <p class="form-error" id="em-err" hidden></p><button class="btn primary block" data-act="em-save">Lưu thay đổi</button>`;
  });
}
function saveEditMeal() {
  const c = SHEET_CTX, m = c.m;
  const patch = { name: $("#em-name").value.trim() || m.name, slot: $("#em-slot").value };
  if (c.byItems) {
    let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 };
    for (const it of c.items) { if (!(it.g > 0)) return err("em-err", "Gram cần lớn hơn 0."); t = addN(t, nutrOf(it.id, it.g)); }
    Object.assign(patch, roundN(t), { items: c.items });
  } else {
    const v = {};
    for (const k of ["k", "p", "c", "f"]) { v[k] = num($("#em-" + k).value); if (!(v[k] >= 0 && v[k] <= 4000)) return err("em-err", "Các giá trị cần là số không âm."); }
    Object.assign(patch, { k: Math.round(v.k), p: r1(v.p), c: r1(v.c), f: r1(v.f) });
  }
  updateMeal(m.id, c.date, patch);
  closeSheet(); toast("Đã lưu"); render();
}

let noteTimer = null;
const INPUT = {
  "pf-live": (el) => { const v = PFV(); v[D(el).k] = num(el.value); const box = $("#pf-calc"); if (box) box.innerHTML = calcBoxHTML(v); },
  "pu-f": () => { const c = SHEET_CTX; readPurchaseForm(c); const row = groceryList().find((x) => x.key === c.key); const box = $("#pu-calc"); if (row && box) box.innerHTML = purchaseCalcHTML(row, c.buy); },
  "day-note": (el) => { clearTimeout(noteTimer); noteTimer = setTimeout(() => { const v = el.value.trim(); if (v) S.body.notes[D(el).date] = v; else delete S.body.notes[D(el).date]; save("body"); }, 600); },
  "ds-ml": (el) => { SHEET_CTX.ml = el.value; const p = $("#ds-prev"); const ml = num(el.value) || 0; const f = FOOD[SHEET_CTX.type]; if (p && f?.ver) { const n = roundN(nutrOf(SHEET_CTX.type, ml)); p.textContent = `≈ ${fmt(n.k)} kcal · P ${fmt(n.p, 1)} g · C ${fmt(n.c, 1)} g · F ${fmt(n.f, 1)} g (USDA)`; } },
  "h-range": (el) => { SHEET_CTX[D(el).k] = Number(el.value); $("#hv-" + D(el).k).textContent = el.value + "/10"; },
  "rs-g": (el) => { const g = num(el.value); if (g >= 0 && g <= 5000) { SHEET_CTX.g[D(el).id] = g; liveRecipeUpdate(); } },
  "am-q": (el) => { SHEET_CTX.q = el.value; const b = $(".sheet-body", SHEET.wrap); const tmp = document.createElement("div"); tmp.innerHTML = addMealHTML(SHEET_CTX); const nl = $("#am-list", tmp); if (nl && $("#am-list", b)) $("#am-list", b).replaceWith(nl); },
  "am-grams": (el) => { const g = num(el.value) || 0; SHEET_CTX.grams = g; const n = roundN(nutrOf(SHEET_CTX.food, g)); $("#am-nut").innerHTML = nut4(n); },
  rq: (el) => { UI.rq = el.value; render(); },
  fq: (el) => { UI.fq = el.value; render(); },
  gq: (el) => { UI.gq = el.value; render(); },
  fgram: (el) => { const g = num(el.value); if (g > 0 && g <= 5000) { UI.fgrams[D(el).id] = g; liveFoodCard(D(el).id, g); } },
  "mg-q": (el) => { SHEET_CTX.q = el.value; refreshSheet(); const i = $("#mg-q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); },
  "pp-q": (el) => { SHEET_CTX.q = el.value; refreshSheet(); const i = $("#pp-q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); },
  "pp-pc": (el) => { const n = num(el.value), f = FOOD[SHEET_CTX.foodId]; if (n > 0 && f?.pc) $("#pp-qty").value = Math.round(n * f.pc.g); },
  "ai-g": (el) => { const g = num(el.value); if (g > 0) { SHEET_CTX.ai.items[Number(D(el).i)].grams = g; const t = roundN(SHEET_CTX.ai.items.reduce((a, it) => addN(a, nutrOf(it.id, it.grams)), { k: 0, p: 0, c: 0, f: 0, fb: 0 })); $("#ai-nut").innerHTML = nut4(t); } },
  "em-g": (el) => { const g = num(el.value); const c = SHEET_CTX; c.items[Number(D(el).i)].g = g > 0 ? g : 0; let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 }; for (const it of c.items) t = addN(t, nutrOf(it.id, it.g)); $("#em-nut").innerHTML = nut4(roundN(t)); },
};
const CHANGE = {
  habit: (el) => { const d = D(el).date, k = D(el).k; (S.profile.habits[d] ||= {})[k] = el.checked; save("profile"); render(); },
  "am-slot": (el) => { SHEET_CTX.slot = el.value; },
  "imp-file": (el) => { const f = el.files?.[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $("#imp").value = String(rd.result || ""); ACT["imp-run"](); }; rd.onerror = () => err("imp-err", "Không đọc được tệp."); rd.readAsText(f); },
  "ai-file": (el) => { const f = el.files?.[0]; if (f) analyzePhoto(SHEET_CTX, f); },
  "g-from": (el) => { S.grocery.range.from = el.value; save("grocery"); render(); },
  "g-to": (el) => { S.grocery.range.to = el.value; save("grocery"); render(); },
  "pu-unit": (el) => { const c = SHEET_CTX; readPurchaseForm(c); c.buy.unit = el.value; refreshSheet(); },
  "pu-photo": (el) => { const f = el.files?.[0]; if (f) { readPurchaseForm(SHEET_CTX); analyzePriceTag(SHEET_CTX, f); } },
  "j-note": (el) => setJournal(today(), { workNote: el.value.trim() || null }),
  "j-grat": (el) => setJournal(today(), { gratitude: el.value.trim() || null }),
  "pf-text": (el) => { PFV()[D(el).k] = el.value.trim(); },
  "pf-chk": (el) => { const v = PFV(); v[D(el).k] = el.checked; const box = $("#pf-calc"); if (box) box.innerHTML = calcBoxHTML(v); },
  "pf-auto": (el) => { const v = PFV(); for (const k of PF_NUM) { const x = $("#pf-" + k); if (x) v[k] = num(x.value); } v.autoTargets = el.checked; pfRefresh(); },
  "hb-show": (el) => { const h = new Set(S.profile.hiddenHabits || []); el.checked ? h.delete(D(el).k) : h.add(D(el).k); S.profile.hiddenHabits = [...h]; save("profile"); render(); },
  dislikes: (el) => { ST().dislikes = el.value.trim(); save("profile"); },
  "water-target": (el) => { const v = num(el.value); if (v >= 1000 && v <= 4000) { ST().waterTarget = Math.round(v); ST().waterManual = true; save("profile"); toast("Đã lưu mục tiêu nước"); } else toast("Mục tiêu nên trong khoảng 1.000–4.000 ml"); render(); },
  fluid: (el) => { ST().fluidRestricted = el.checked; save("profile"); render(); },
  reminders: (el) => { ST().reminders.on = el.checked; save("profile"); render(); },
  "rem-times": (el) => { const t = el.value.split(/[,;\s]+/).map((x) => x.trim()).filter((x) => /^\d{1,2}:\d{2}$/.test(x)).map((x) => x.padStart(5, "0")); ST().reminders.times = t; save("profile"); toast(`Đã lưu ${t.length} giờ nhắc`); render(); },
  "share-on": async (el) => {
    S.profile.sharing.on = el.checked; save("profile");
    try { if (el.checked) { await publishShare(); toast("Đã bật chia sẻ"); } else { await revokeShare(); toast("Đã thu hồi quyền xem"); } }
    catch { toast("Chưa cập nhật được chia sẻ, thử lại sau"); }
    render();
  },
  "share-field": (el) => { S.profile.sharing.fields[D(el).k] = el.checked; save("profile"); queueShare(); },
  "share-sym": (el) => { S.profile.sharing.fields.symptoms = el.checked; save("profile"); queueShare(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", (e) => { const el = e.target.closest("[data-input]"); if (el) INPUT[el.dataset.input]?.(el); });
document.addEventListener("change", (e) => { const el = e.target.closest("[data-change]"); if (el) CHANGE[el.dataset.change]?.(el); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && SHEET) closeSheet();
  if (e.key === "Enter" && e.target.id === "coach-in" && !e.shiftKey) { e.preventDefault(); coachSend(e.target.value); }
});

/* ---------- onboarding ---------- */
const ONB = { step: 0, v: null };
const ONB_KEYS = [[], ["age", "heightCm", "startWeightKg", "waistCm"], ["goalKg"], [], []];
const PFV = () => ($(".onb") && ONB.v ? ONB.v : SHEET_CTX?.v || ONB.v);
function pfRefresh() { if ($(".onb")) renderOnb(); else refreshSheet(); }
function showOnboarding() { ONB.step = 0; ONB.v = JSON.parse(JSON.stringify(ST())); if (!ONB.v.goalKg && ONB.v.startWeightKg) ONB.v.goalKg = ONB.v.startWeightKg; renderOnb(); }
function renderOnb() {
  let el = $(".onb");
  if (!el) { el = document.createElement("div"); el.className = "onb"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "Thiết lập ban đầu"); document.body.appendChild(el); document.body.classList.add("locked"); }
  const v = ONB.v, sc = el.scrollTop;
  const dots = `<div class="dots" aria-hidden="true">${[0, 1, 2, 3, 4].map((i) => `<i class="${i === ONB.step ? "on" : ""}"></i>`).join("")}</div>`;
  const back = ONB.step ? `<button class="btn ghost" data-act="onb-back">Quay lại</button>` : "";
  const next = (t = "Tiếp tục") => `<p class="form-error" id="onb-err" hidden></p><div class="btns">${back}<button class="btn primary" data-act="onb-next">${t}</button></div>`;
  const steps = [
    `<div style="display:grid;place-items:center;padding-top:12px">${MASCOT.replace('class="mascot"', 'class="mascot" style="width:110px;height:110px"')}</div><h2>Chào bạn!</h2><p class="muted">90 ngày chăm sóc bản thân: ăn đủ, uống đủ, sống có kế hoạch — giảm cân nhẹ nhàng và an toàn.</p>
     <div class="list">${[["menu", "Thực đơn món Việt bình dân tính theo cơ thể bạn, đổi bữa linh hoạt khi dậy muộn"], ["cart", "Đi chợ: tự gộp nguyên liệu, nhập giá là ra tổng tiền, mua dư tự vào tủ lạnh"], ["drop", "Nước uống, tâm trạng, công việc, việc quan trọng mỗi ngày"], ["chart", "Cân nặng và báo cáo từ dữ liệu thật"], ["spark", "Phụng Coach dùng Claude thật, không giả lập"]].map(([i, t]) => `<div class="item"><div class="thumb">${ic(i, 22)}</div><span class="grow small">${t}</span></div>`).join("")}</div>
     <p class="tiny muted">Khoảng 2 phút để điền. Mọi số liệu đều chỉnh lại được sau.</p><button class="btn primary block" data-act="onb-next">Bắt đầu</button>`,
    `<p class="eyebrow">Bước 1/4 · Cơ thể</p><h2>Cho mình biết về bạn</h2>${pfBody(v)}${next()}`,
    `<p class="eyebrow">Bước 2/4 · Mục tiêu</p><h2>Bạn muốn đi nhanh hay chậm?</h2>${pfGoal(v)}${next()}`,
    `<p class="eyebrow">Bước 3/4 · Ăn uống & sinh hoạt</p><h2>Thói quen của bạn</h2>${pfLife(v)}${next()}`,
    `<p class="eyebrow">Bước 4/4 · Sức khỏe</p><h2>An toàn trước tiên</h2>${pfHealth(v)}
     <label class="field"><span>Ngày bắt đầu hành trình</span><input class="input" type="date" id="onb-start" value="${startDate()}"></label>
     <div class="btns">${back}<button class="btn brand" data-act="onb-finish">Tạo kế hoạch của tôi</button></div>`,
  ];
  el.innerHTML = `<div class="onb-in">${dots}${steps[ONB.step]}</div>`;
  el.scrollTop = ONB.lastStep === ONB.step ? sc : 0;
  ONB.lastStep = ONB.step;
}

/* ---------- khởi động ---------- */
let reminderShown = "";
function reminderTick() {
  const r = ST().reminders;
  if (!r.on) return;
  const d = new Date(), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (r.times.includes(t) && reminderShown !== today() + t) { reminderShown = today() + t; toast(`Đến giờ uống nước rồi, ${displayName()} ơi 💧`); }
}
function watchShared() {
  if (!SYNC.db) return;
  try {
    SYNC.db.collection("shared").onSnapshot((snap) => {
      UI.shared = snap.docs.filter((d) => d.exists && d.id !== SYNC.uid).map((d) => d.data());
      if (UI.tab === "me") scheduleRender();
    }, () => {});
  } catch {}
}
function boot() {
  const hadLocal = loadLocal();
  refreshTargets();
  try { const t = localStorage.getItem("ppfit-tab"); if (PAGES[t]) UI.tab = t; } catch {}
  applyTheme();
  UI.planDay = journeyDay();
  document.body.insertAdjacentHTML("beforeend", `<nav class="nav" aria-label="Điều hướng chính"><div class="nav-in">${NAV.map(([k, t, i]) => `<button data-act="tab" data-v="${k}">${ic(i, 22)}<span>${t}</span></button>`).join("")}</div></nav><button class="fab" data-act="fab" aria-label="Ghi nhanh">${ic("plus", 22)} Ghi nhanh</button>`);
  render();
  const splash = $("#splash");
  const t0 = Date.now();
  const done = () => {
    refreshTargets();
    UI.planDay = journeyDay();
    applyTheme();
    render();
    setTimeout(() => { splash?.classList.add("out"); setTimeout(() => splash?.remove(), 500); if (!ST().onboarded || (ST().profileVersion || 0) < 2) showOnboarding(); }, Math.max(0, 900 - (Date.now() - t0)));
  };
  if (hadLocal && ST().onboarded && ST().profileVersion >= 2) { done(); initSync().then(watchShared); }
  else { SYNC.onReady.push(done); initSync().then(watchShared); }
  SYNC.onReady.push(() => { if (!ST().startDate && ST().onboarded) { ST().startDate = today(); save("profile"); } });
  initSample();
  if (!IN_CLAUDE) navigator.storage?.persist?.().catch(() => {});
  setInterval(reminderTick, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleRender(); });
}
boot();

      });
    }).catch(() => {});
  });
}
</script>
